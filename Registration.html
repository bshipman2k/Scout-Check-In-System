<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Family Registration</title>
  <style>
    input, select, textarea { font-size: 16px !important; }
  </style>
  <?!= include('Stylesheet'); ?>
  <script>
    // Prevent iOS zoom - readonly trick
    document.addEventListener('DOMContentLoaded', function() {
      var inputs = document.querySelectorAll('input[type="text"], input[type="email"], input[type="tel"], input[type="number"], textarea');
      inputs.forEach(function(input) {
        input.setAttribute('readonly', 'readonly');
        input.style.fontSize = '16px';
        
        input.addEventListener('focus', function() {
          this.removeAttribute('readonly');
        }, {once: true});
        
        input.addEventListener('touchstart', function() {
          this.removeAttribute('readonly');
        }, {once: true});
      });
    });
  </script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📝 Family Registration</h1>
      <p class="subtitle">One-time setup for your family</p>
      <a href="#home" onclick="goHome(); return false;" class="back-link">← Back to Home</a>
    </div>

    <div class="form-section">
      <form id="registrationForm">
        <h3>Family Information</h3>
        
        <div class="form-group">
          <label for="lastName">Family Last Name *</label>
            <input type="text" id="lastName" name="lastName" required>
        <h3>Parent/Guardian 1 *</h3>
        
        <div class="form-group">
          <label for="parent1Name">Full Name *</label>
            <input type="text" id="parent1Name" name="parent1Name" required>
        <div class="form-group">
          <label for="parent1Phone">Cell Phone *</label>
          <input type="tel" id="parent1Phone" name="parent1Phone" required placeholder="(555) 123-4567">
        </div>

        <div class="form-group">
          <label for="parent1Email">Email Address *</label>
          <input type="email" id="parent1Email" name="parent1Email" required>
        </div>

        <h3>Parent/Guardian 2 (Optional)</h3>
        
        <div class="form-group">
          <label for="parent2Name">Full Name</label>
          <input type="text" id="parent2Name" name="parent2Name">
        </div>

        <div class="form-group">
          <label for="parent2Phone">Cell Phone</label>
          <input type="tel" id="parent2Phone" name="parent2Phone" placeholder="(555) 123-4567">
        </div>

        <div class="form-group">
          <label for="parent2Email">Email Address</label>
          <input type="email" id="parent2Email" name="parent2Email">
        </div>

        <h3>Family Members</h3>
        <p class="help-text">Add all Scouts and siblings who may attend campouts</p>

        <div id="membersList">
          <!-- Members will be added here dynamically -->
        </div>

        <button type="button" class="btn btn-secondary" onclick="addMember()">+ Add Family Member</button>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Register Family</button>
        </div>
      </form>

      <div id="message" class="message"></div>
    </div>
  </div>

  <script>
    var memberCount = 0;

    function addMember() {
      memberCount++;
      var membersDiv = document.getElementById('membersList');
      
      var memberDiv = document.createElement('div');
      memberDiv.className = 'member-item';
      memberDiv.id = 'member' + memberCount;
      
      memberDiv.innerHTML = `
        <div class="member-header">
          <h4>Family Member ${memberCount}</h4>
          <button type="button" class="btn-remove" onclick="removeMember(${memberCount})">Remove</button>
        </div>
        <div class="form-group">
          <label for="memberName${memberCount}">First Name *</label>
          <input type="text" id="memberName${memberCount}" name="memberName${memberCount}" required placeholder="First name">
        </div>
        <div class="form-group">
          <label>Does this family member share the family name?</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="memberSharedName${memberCount}" value="yes" checked onchange="toggleMemberLastName(${memberCount})">
              Yes
            </label>
            <label class="radio-label">
              <input type="radio" name="memberSharedName${memberCount}" value="no" onchange="toggleMemberLastName(${memberCount})">
              No
            </label>
          </div>
        </div>
        <div class="form-group member-lastname-field" id="memberLastNameGroup${memberCount}" style="display: none;">
          <label for="memberLastName${memberCount}">Last Name *</label>
          <input type="text" id="memberLastName${memberCount}" name="memberLastName${memberCount}" placeholder="Last name">
        </div>
        <div class="form-group">
          <label for="memberType${memberCount}">Type *</label>
          <select id="memberType${memberCount}" name="memberType${memberCount}" required onchange="toggleMemberTypeFields(${memberCount})">
            <option value="">Select...</option>
            <option value="Scout">Scout</option>
            <option value="Sibling">Sibling</option>
            <option value="Adult - Non-Guardian">Adult - Non-Guardian</option>
          </select>
        </div>
        <div class="form-group">
          <label for="memberAge${memberCount}">Age (optional)</label>
          <input type="number" id="memberAge${memberCount}" name="memberAge${memberCount}" min="1" max="99">
        </div>
        <div class="form-group member-rank-field" id="memberRankGroup${memberCount}" style="display: none;">
          <label for="memberRank${memberCount}">Rank</label>
          <select id="memberRank${memberCount}" name="memberRank${memberCount}">
            <option value="">Select Rank...</option>
            <option value="Lion">Lion</option>
            <option value="Tiger">Tiger</option>
            <option value="Wolf">Wolf</option>
            <option value="Bear">Bear</option>
            <option value="Webelos">Webelos</option>
            <option value="Arrow of Light">Arrow of Light</option>
            <option value="Den Chief">Den Chief</option>
          </select>
        </div>
        <div class="form-group member-den-field" id="memberDenGroup${memberCount}" style="display: none;">
          <label for="memberDen${memberCount}">Den</label>
          <input type="text" id="memberDen${memberCount}" name="memberDen${memberCount}" placeholder="e.g., Den 1, Den 5">
        </div>
        <div class="form-group member-adult-fields" id="memberAdultGroup${memberCount}" style="display: none;">
          <label>Are they registered with Scouting America?</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="memberRegistered${memberCount}" value="yes">
              Yes
            </label>
            <label class="radio-label">
              <input type="radio" name="memberRegistered${memberCount}" value="no">
              No
            </label>
          </div>
        </div>
        <div class="form-group member-adult-fields" id="memberYPTGroup${memberCount}" style="display: none;">
          <label>Do they have active Safeguarding Youth Training?</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="memberYPT${memberCount}" value="yes">
              Yes
            </label>
            <label class="radio-label">
              <input type="radio" name="memberYPT${memberCount}" value="no">
              No
            </label>
          </div>
        </div>
      `;
      
      membersDiv.appendChild(memberDiv);
    }

    function removeMember(id) {
      var memberDiv = document.getElementById('member' + id);
      if (memberDiv) {
        memberDiv.remove();
      }
    }

    function toggleMemberLastName(memberIndex) {
      var sharedName = document.querySelector('input[name="memberSharedName' + memberIndex + '"]:checked');
      var lastNameGroup = document.getElementById('memberLastNameGroup' + memberIndex);
      var lastNameInput = document.getElementById('memberLastName' + memberIndex);
      
      if (sharedName && lastNameGroup && lastNameInput) {
        if (sharedName.value === 'no') {
          lastNameGroup.style.display = 'block';
          lastNameInput.required = true;
        } else {
          lastNameGroup.style.display = 'none';
          lastNameInput.required = false;
        }
      }
    }

    function toggleMemberTypeFields(memberIndex) {
      var typeSelect = document.getElementById('memberType' + memberIndex);
      var rankGroup = document.getElementById('memberRankGroup' + memberIndex);
      var denGroup = document.getElementById('memberDenGroup' + memberIndex);
      var adultGroup = document.getElementById('memberAdultGroup' + memberIndex);
      var yptGroup = document.getElementById('memberYPTGroup' + memberIndex);
      
      if (typeSelect && rankGroup && denGroup && adultGroup && yptGroup) {
        var type = typeSelect.value;
        if (type === 'Scout') {
          rankGroup.style.display = 'block';
          denGroup.style.display = 'block';
          adultGroup.style.display = 'none';
          yptGroup.style.display = 'none';
        } else if (type === 'Adult - Non-Guardian') {
          rankGroup.style.display = 'none';
          denGroup.style.display = 'none';
          adultGroup.style.display = 'block';
          yptGroup.style.display = 'block';
        } else {
          rankGroup.style.display = 'none';
          denGroup.style.display = 'none';
          adultGroup.style.display = 'none';
          yptGroup.style.display = 'none';
        }
      }
    }

    // Add first member by default
    window.onload = function() {
      addMember();
    };

    document.getElementById('registrationForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      var messageDiv = document.getElementById('message');
      messageDiv.className = 'message';
      messageDiv.textContent = 'Registering family...';
      
      // Collect form data
      var familyData = {
        lastName: document.getElementById('lastName').value,
        parent1Name: document.getElementById('parent1Name').value,
        parent1Phone: document.getElementById('parent1Phone').value,
        parent1Email: document.getElementById('parent1Email').value,
        parent2Name: document.getElementById('parent2Name').value,
        parent2Phone: document.getElementById('parent2Phone').value,
        parent2Email: document.getElementById('parent2Email').value,
        members: []
      };
      
      // Collect all members
      var membersDiv = document.getElementById('membersList');
      var memberDivs = membersDiv.getElementsByClassName('member-item');
      
      for (var i = 0; i < memberDivs.length; i++) {
        var memberDiv = memberDivs[i];
        var memberId = memberDiv.id.replace('member', '');
        
        var nameInput = document.getElementById('memberName' + memberId);
        var sharedNameRadio = document.querySelector('input[name="memberSharedName' + memberId + '"]:checked');
        var lastNameInput = document.getElementById('memberLastName' + memberId);
        var typeInput = document.getElementById('memberType' + memberId);
        var ageInput = document.getElementById('memberAge' + memberId);
        var rankInput = document.getElementById('memberRank' + memberId);
        var denInput = document.getElementById('memberDen' + memberId);
        var registeredRadio = document.querySelector('input[name="memberRegistered' + memberId + '"]:checked');
        var yptRadio = document.querySelector('input[name="memberYPT' + memberId + '"]:checked');
        
        if (nameInput && typeInput && nameInput.value && typeInput.value) {
          var memberData = {
            name: nameInput.value,
            sharedLastName: sharedNameRadio ? sharedNameRadio.value === 'yes' : true,
            lastName: lastNameInput ? lastNameInput.value : '',
            type: typeInput.value,
            age: ageInput.value,
            rank: rankInput ? rankInput.value : '',
            den: denInput ? denInput.value : ''
          };
          
          // Add Adult - Non-Guardian specific fields
          if (typeInput.value === 'Adult - Non-Guardian') {
            memberData.registered = registeredRadio ? registeredRadio.value : '';
            memberData.ypt = yptRadio ? yptRadio.value : '';
          }
          
          familyData.members.push(memberData);
        }
      }
      
      if (familyData.members.length === 0) {
        messageDiv.className = 'message error';
        messageDiv.textContent = 'Please add at least one family member.';
        return;
      }
      
      // Submit to backend
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.success) {
            messageDiv.className = 'message success';
            messageDiv.textContent = response.message + ' Family ID: ' + response.familyId;
            document.getElementById('registrationForm').reset();
            document.getElementById('membersList').innerHTML = '';
            memberCount = 0;
            addMember();
            
            // Scroll to message
            messageDiv.scrollIntoView({ behavior: 'smooth' });
          } else {
            messageDiv.className = 'message error';
            messageDiv.textContent = response.message;
          }
        })
        .withFailureHandler(function(error) {
          messageDiv.className = 'message error';
          messageDiv.textContent = 'Error: ' + error.message;
        })
        .registerFamily(familyData);
    });

    function goHome() {
      var baseUrl = 'https://script.google.com/macros/s/AKfycbyFytMVAE404Kz3r3V_Jv0kmFP_CunjWKLNXIZErmuSBwMm_QweS0ZvAc2-3Q12oUtDnA/exec';
      window.top.location.href = baseUrl;
    }
  </script>
</body>
</html>
